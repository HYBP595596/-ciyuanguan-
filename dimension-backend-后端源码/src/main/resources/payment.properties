# ============================================================================
# 平台与支付配置
# ============================================================================

# ---------- 通用 ----------
# 对外回调地址前缀（部署到别的 context / 域名时改这里，PayNotify 的 notify_url 由它拼出来）
payment.api.base=/dimension_dev_01_war_exploded

# 待支付订单超时关闭（分钟）：超时未支付自动关单，关闭后不能再支付
commission.order.timeout.minutes=30

# 平台抽成比例：0.10 = 抽 10%，验收时拆成 PLATFORM_FEE 流水，其余走 INCOME 给画师
platform.fee.rate=0.10

# ---------- 模拟渠道（开发/演示默认可用） ----------
payment.mock.secret=dimension-mock-payment-secret

# ---------- 微信支付（V2 统一下单，未填参数则渠道不可用） ----------
# 协议层已实现：统一下单参数拼装、回调 MD5 验签、金额核对
# 还需要你做的是：服务端真正发起 HTTPS 请求 + 配置商户 API 证书（退款用）
payment.wechat.enabled=false
payment.wechat.appId=
payment.wechat.mchId=
payment.wechat.apiKey=
payment.wechat.tradeType=NATIVE
payment.wechat.notifyUrl=
payment.wechat.spbillCreateIp=127.0.0.1

# ---------- 支付宝（电脑网站支付，未填参数则渠道不可用） ----------
# 协议层已实现：page.pay 参数 + RSA2 签名、异步通知 RSA2 验签、app_id/金额核对
# 还需要你做的是：服务端真正发起请求 + 退款接口
payment.alipay.enabled=false
payment.alipay.appId=
payment.alipay.privateKey=
payment.alipay.publicKey=
payment.alipay.notifyUrl=
payment.alipay.gateway=https://openapi.alipay.com/gateway.do
